[pytest]
testpaths = pruebas
pythonpath = .
addopts = -ra -m "not lento"
markers =
    integracion: pruebas que ejecutan ffmpeg/Rhubarb u otros binarios reales
    medicion: mediciones de rendimiento y memoria (lentas)
    lento: pruebas con modelos de IA reales (segmentación, inpainting); se excluyen por defecto, usa -m lento
