# Reglas del director automático (FR-090 a FR-094, FR-044 a FR-046).
# Todo lo que NO escribas aquí usa el valor por defecto. Para empezar, deja este archivo como está y cambia solo lo que quieras.
# Cada corte cambia UN solo elemento: el plano de la cámara, la pose o un acento. Los cortes caen en una pausa de la voz.

toma_s: [6, 20]            # segundos entre un corte y el siguiente (mínimo, máximo)
tolerancia_pausa_s: 2      # cuánto puede moverse un corte para caer en una pausa de la voz

cambio:
  prob_plano: 0.5          # probabilidad de que un corte sea solo un cambio de plano (misma pose, corte seco). 0 = nunca

planos:                    # cámara virtual: PL1 cuerpo entero ... PL6 primerísimo primer plano
  permitidos: [PL1, PL2, PL3, PL4, PL5]
  inicial: PL3
  paso_maximo: 2           # el plano puede saltar hasta dos pasos (PL3 -> PL1 o PL5); con 1 solo camina de a un paso y se queda cerca del centro
  pesos: {PL1: 1.2, PL2: 2.0, PL3: 2.0, PL4: 2.0, PL5: 2.0}    # cuánto se prefiere cada plano (parejos: ningún plano manda)
  evitar_volver: 0.5       # 0 a 1: peso de volver al plano anterior (1 = sin preferencia; evita vaivenes PL3-PL4-PL3-PL4)
  max_mismo_s: 25          # si el plano lleva más de estos segundos igual, el siguiente corte lo cambia (0 = sin límite)

reposo:
  activo: true
  mezcla_frames: 2         # frames de mezcla al cambiar de pose. 0 = corte seco

acentos:                   # gestos breves (pulgar, señalar, bienvenida, contar) que vuelven solos al reposo
  activo: true
  probabilidad: 0.5        # probabilidad de que un cambio de pose sea un acento
  duracion_s: [3, 6]
  separacion_min_s: 20     # como mínimo, tantos segundos entre dos acentos

mirada:                    # poses 3/4: las que terminan en _eye_contact miran a cámara; las demás 3/4 miran hacia un lado
  lateral_max_s: 1         # una pose que mira de lado dura como mucho esto (0 = sin límite); tras ella siempre cambia la pose
  peso_lateral: 0.25       # cuánto se prefiere al elegir una pose nueva frente a una que mira a cámara (1.0). 1 = las trata igual
  desvio:                  # mirada desviada: desde una pose _eye_contact se pasa un instante a su gemela de lado y se vuelve (como apartar los ojos al hablar)
    activo: true
    cada_s: [6, 14]        # cada cuántos segundos (mínimo, máximo)
    duracion_s: [0.5, 1.0] # cuánto dura el desvío (máximo permitido: 3 s)
